<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lab 4 - Calendar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="./resources/css/style.css">
  </head>
  <body>
    <div class="row">
        <div class="col-2">
            <div class="custom-container">
                <button class="btn btn-primary mt-3" data-bs-toggle="modal" data-bs-target="#exampleModal">Create Event</button>
            </div>
        </div>
        <div class="col">
            <div class="container-md container-fluid py-4 h-100">
                <div id="calendar" class="row h-100">
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="sunday">
                        <div class="h6 text-center position-relative py-2 day">Sunday</div>
                        <div id="sunday_events"></div>
                    </div>
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="monday">
                        <div class="h6 text-center position-relative py-2 day">Monday</div>
                        <div id="monday_events"></div>
                    </div>
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="tuesday">
                        <div class="h6 text-center position-relative py-2 day">Tuesday</div>
                        <div id="tuesday_events"></div>
                    </div>
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="wednesday">
                        <div class="h6 text-center position-relative py-2 day">Wednesday</div>
                        <div id="wednesday_events"></div>
                    </div>
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="thursday">
                        <div class="h6 text-center position-relative py-2 day">Thursday</div>
                        <div id="thursday_events"></div>
                    </div>
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="friday">
                        <div class="h6 text-center position-relative py-2 day">Friday</div>
                        <div id="friday_events"></div>
                    </div>
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="saturday">
                        <div class="h6 text-center position-relative py-2 day">Saturday</div>
                        <div id="saturday_events"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">New Event</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="event_form" novalidate>
                        <label for="event_name" class="form-label">Event Name</label>
                        <input type="text" class="form-control" id="event_name" required>

                        <label for="event_category" class="form-label mt-2">Event Category</label>
                        <select class="form-select" id="event_category" required>
                            <option selected disabled value="">Choose...</option>
                            <option value="Academic">Academic</option>
                            <option value="Social">Social</option>
                            <option value="Work">Work</option>
                            <option value="Personal">Personal</option>
                        </select>

                        <label for="event_weekday" class="form-label mt-2">Date</label>
                        <input type="date" class="form-control" id="event_weekday" required>

                        <label for="event_time" class="form-label mt-2">Time</label>
                        <input type="time" class="form-control" id="event_time" required>

                        <label for="event_modality" class="form-label mt-2">Event Modality</label>
                        <select class="form-select" id="event_modality" required>
                            <option selected disabled value="">Choose...</option>
                            <option value="In Person">In Person</option>
                            <option value="Remote">Remote</option>
                        </select>

                        <div id="location_group">
                            <label for="event_location" class="form-label mt-2">Location</label>
                            <input type="text" class="form-control" id="event_location">
                        </div>

                        <div id="remote_url_group" style="display: none;">
                            <label for="event_remote_url" class="form-label mt-2">Remote URL</label>
                            <input type="url" class="form-control" id="event_remote_url" placeholder="https://...">
                        </div>

                        <label for="event_attendees" class="form-label mt-2">Attendees</label>
                        <input type="text" class="form-control" id="event_attendees">
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" id="save_event_btn">Save changes</button>
                </div>
            </div>
        </div>
    </div>

    <!--scripts-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="resources/js/script.js"></script>
  </body>
</html>
